[package]
name = "agent-html-lint"
version = "0.1.0"
edition = "2024"
description = "A fast, JSON-only HTML linter for coding agents"
license = "MIT OR Apache-2.0"

[[bin]]
name = "html-lint"
path = "src/main.rs"

[dependencies]
html5gum = "0.8.4"
ignore = "0.4.23"
rayon = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
strip = "none"
