<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LintBolt benchmark speedups</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&amp;family=Roboto:wght@400;500;700&amp;display=swap');
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f8f9fa; }
    body { display: grid; place-items: center; padding: 24px; }
    svg { display: block; width: min(960px, 100%); height: auto; background: #fff; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="benchmark-title benchmark-desc">
    <title id="benchmark-title">LintBolt benchmark speedups</title>
    <desc id="benchmark-desc">Horizontal bars show LintBolt running 21.79 times faster on a 16 kibibyte clean file, 26.37 times faster on a 512 kibibyte repair file, and 1.55 times faster on a 16 mebibyte report file than the fastest qualifying alternative.</desc>
    <defs>
      <style>
        .sans { font-family: Roboto, Arial, sans-serif; }
        .mono { font-family: "Roboto Mono", Menlo, Consolas, monospace; }
        .eyebrow { fill: #1a73e8; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
        .title { fill: #202124; font-size: 28px; font-weight: 500; }
        .subtitle { fill: #5f6368; font-size: 14px; }
        .row-title { fill: #202124; font-size: 14px; font-weight: 500; }
        .row-detail { fill: #5f6368; font-size: 12px; }
        .tick { fill: #5f6368; font-size: 11px; }
        .value { fill: #202124; font-size: 13px; font-weight: 500; }
        .legend { fill: #5f6368; font-size: 11px; }
      </style>
    </defs>

    <rect width="960" height="600" fill="#ffffff"/>
    <text class="sans eyebrow" x="64" y="64">BENCHMARK / SPEEDUP</text>
    <text class="sans title" x="64" y="108">Agent verification, measured end to end</text>
    <text class="sans subtitle" x="64" y="136">Median one-shot process time · higher speedup is better</text>

    <g stroke="#e8eaed" stroke-width="1">
      <line x1="256" y1="176" x2="256" y2="472"/>
      <line x1="352" y1="176" x2="352" y2="472"/>
      <line x1="448" y1="176" x2="448" y2="472"/>
      <line x1="544" y1="176" x2="544" y2="472"/>
      <line x1="640" y1="176" x2="640" y2="472"/>
      <line x1="736" y1="176" x2="736" y2="472"/>
      <line x1="832" y1="176" x2="832" y2="472"/>
    </g>

    <line x1="275.2" y1="176" x2="275.2" y2="472" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text class="mono tick" x="283" y="188" fill="#1a73e8">1× parity</text>

    <text class="sans row-title" x="240" y="212" text-anchor="end">16 KiB clean</text>
    <text class="sans row-detail" x="240" y="232" text-anchor="end">vs Biome</text>
    <rect x="256" y="200" width="576" height="40" rx="4" fill="#f1f3f4"/>
    <rect x="256" y="200" width="418.33" height="40" rx="4" fill="#9aa0a6"/>
    <text class="mono value" x="686" y="225">21.79×</text>

    <text class="sans row-title" x="240" y="316" text-anchor="end">512 KiB repair</text>
    <text class="sans row-detail" x="240" y="336" text-anchor="end">vs HTMLHint</text>
    <rect x="256" y="304" width="576" height="40" rx="4" fill="#f1f3f4"/>
    <rect x="256" y="304" width="506.26" height="40" rx="4" fill="#9aa0a6"/>
    <text class="mono value" x="774" y="329">26.37×</text>

    <text class="sans row-title" x="240" y="420" text-anchor="end">16 MiB report</text>
    <text class="sans row-detail" x="240" y="440" text-anchor="end">vs Biome</text>
    <rect x="256" y="408" width="576" height="40" rx="4" fill="#f1f3f4"/>
    <rect x="256" y="408" width="29.76" height="40" rx="4" fill="#1a73e8"/>
    <text class="mono value" x="298" y="433">1.55×</text>

    <g class="mono tick" text-anchor="middle">
      <text x="256" y="496">0×</text>
      <text x="352" y="496">5×</text>
      <text x="448" y="496">10×</text>
      <text x="544" y="496">15×</text>
      <text x="640" y="496">20×</text>
      <text x="736" y="496">25×</text>
      <text x="832" y="496">30×</text>
    </g>

    <line x1="64" y1="536" x2="896" y2="536" stroke="#dadce0"/>
    <rect x="64" y="560" width="12" height="12" rx="2" fill="#9aa0a6"/>
    <text class="sans legend" x="84" y="570">startup and diagnostics cases</text>
    <rect x="304" y="560" width="12" height="12" rx="2" fill="#1a73e8"/>
    <text class="sans legend" x="324" y="570">hardest throughput case</text>
    <text class="mono legend" x="896" y="570" text-anchor="end">Apple ARM · 8-way · JSON output</text>
  </svg>
</body>
</html>
